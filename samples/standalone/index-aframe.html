<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
		<meta http-equiv="Content-Security-Policy" content=
			  "default-src * gap://ready file: localhost:*;
			  style-src 'self' 'unsafe-inline';
			  connect-src 'self' blob: data: *;
			  img-src 'self' blob: data: *;
			  script-src 'self' 'unsafe-inline' 'unsafe-eval' aframe.io localhost:* ;
			  script-src-elem 'self' https: blob:;
			  worker-src 'self' blob:;
			  child-src 'unsafe-inline' blob: 'self';
			  media-src 'self' blob: data: https:;">
		
		<!-- webpack bundles with application javascripts and libraries -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>
		<script src="./MantisRYSKaframe.min.js"></script>
		<script src="./aframe.js"></script>
		<style type="text/css">
			body { position: relative }
			#progress { width: 100%; position: absolute; bottom: 5px }
			#play { position: absolute; top: 15px; left: 15px; width: 70px; height: 35px; font-size: 17px; z-index: 2 }
			menu { position: absolute; top: 0px; right: 10px; display: flex; flex-direction: row; z-index: 2; gap: 15px }
			menu button { width: 100px; height: 35px; font-size: 17px; }
			@media screen and (max-width: 1024px) {
				menu { flex-direction: column; }
			}
		</style>
		<title>A-Frame Rysk</title>
	</head>
	<body>
		<button id="play">PLAY</button>
		<menu>
			<a href="./index-splat.html?type=splinter" id="splinter"><button>Splinter</button></a>
			<a href="./index-splat.html?type=spack" id="spack"><button>Spack</button></a>
			<a href="./index.html"><button id="three">Three.js</button></a>
			<a href="./index-playcanvas.html"><button id="playcanvas">Playcanvas</button></a>
			<a href="./index-synchronized.html"><button id="synchronized">Synced</button></a>
		</menu>
		<a-scene>
		  <a-assets>
			<img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
			<img id="skyTexture" src="https://cdn.aframe.io/a-painter/images/sky.jpg" crossorigin="anonymous">
		  </a-assets>

		  <mantis-ryskurl 
			  id="chloe"
			  position="0 0 -2" 
			  volume="1" 
			  loop="true" 
			  dataurl="./chloe_battle.syk" 
			  videourl="./chloe_battle.mp4"
			  preview="full">
		  </mantis-ryskurl>

		  <mantis-splaturl 
			  id="phillips"
			  position="1 0 -2" 
			  rotation="0 180 0"
			  volume="1" 
			  loop="true" 
			  dataurl="https://prg-syk-uploads.s3.us-east-1.amazonaws.com/robo/2025_10_09_david_phillips_pitch_09_phillips_pitch_09_50k_splinter.splinter" 
			  mediaurl="https://prg-syk-uploads.s3.us-east-1.amazonaws.com/robo/2025_10_09_david_phillips_pitch_09_phillips_pitch_09_50k_splinter.m4a"
			  preview="full" >
		  </mantis-splaturl>

		  <!-- Background sky. -->
		  <a-sky height="2048" radius="30" src="#skyTexture" theta-length="90" width="2048"></a-sky>

		  <!-- Ground. -->
		  <a-circle src="#groundTexture" rotation="-90 0 0" radius="32"></a-circle>
		</a-scene>
		<div id="playbackratediv">
			<label for="playbackrate">Playback rate:</label><br />
			<input id="playbackrate" type="range" min="0.07" max="1.0" step="0.01" value="1.0" />
		</div>
		<progress id="progress" value="0" min="0"></progress>
	</body>
</html>
