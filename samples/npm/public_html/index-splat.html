<!DOCTYPE html>
<html>
	<head>
		<title>Three.js Splat</title>
		<meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
		<meta http-equiv="Content-Security-Policy" content=
			  "default-src * gap://ready file: localhost:*;
			  style-src 'self' 'unsafe-inline';
			  connect-src 'self' blob: data: *;
			  img-src 'self' blob: data: *;
			  script-src 'self' 'unsafe-inline' 'unsafe-eval' localhost:* ;
			  script-src-elem 'self' https: blob:;
			  worker-src 'self' blob:;
			  child-src 'unsafe-inline' blob:;
			  media-src 'self' blob: data: https:;">
		
		<!-- webpack bundles with application javascripts and libraries -->
		<script type="text/javascript" src="vendors.bundle.js"></script>
		<script type="text/javascript" src="mantis.bundle.js"></script>
		<script type="text/javascript" src="splat.bundle.js"></script>
		<style type="text/css">
			#viewport { width: 100vw; height: 100vh; position: relative }
			#progress { width: 100%; position: absolute; bottom: 5px }
			#play { position: absolute; top: 15px; left: 15px; width: 70px; height: 35px; font-size: 17px; }
			#splinter, #spack { position: absolute; top: 15px; right: 15px; width: 100px; height: 35px; font-size: 17px; }
			#playcanvas { position: absolute; top: 15px; right: 130px; width: 100px; height: 35px; font-size: 17px; }
			#aframe { position: absolute; top: 15px; right: 245px; width: 100px; height: 35px; font-size: 17px; }
			#three { position: absolute; top: 15px; right: 365px; width: 100px; height: 35px; font-size: 17px; }
			#playbackratediv { top: 55px; position: absolute; left:15px; font-weight: bold; font-family: Verdana, Geneva, Tahoma, sans-serif; }
			body { margin: 0 }
			.flexBody {
				margin:0;
				padding:0;
				display:flex;
				justify-content: center;
				position: relative;
			}
			.fps-counter {
				position: absolute;
				top: 0;
				color: white;
				background: rgba(0, 0, 0, 0.5);
				padding: 5;
				font-family: monospace;
				font-size: 20px;
				z-index: 100;
			}

			@media (min-width: 768px) {
				.fps-counter { font-size: 20px;	}
			}
		</style>
	</head>
	<body>
		<div class="flexBody">
			<div id="fpsCounter" class="fps-counter"></div>
		</div>
		<div id="viewport">
			<button id="play">Play</button>
			<a href="./index.html"><button id="three">Three.js</button></a>
			<a href="./index-playcanvas.html"><button id="playcanvas">Playcanvas</button></a>
			<a href="./index-aframe.html"><button id="aframe">A-Frame</button></a>
			<a href="./index-splat.html?type=spack"><button id="spack">Spack</button></a>
			<a href="./index-splat.html?type=splinter"><button id="splinter">Splinter</button></a>
			<div id="playbackratediv">
				<label for="playbackrate">Playback rate:</label><br />
				<input id="playbackrate" type="range" min="0.07" max="1.0" step="0.01" value="1.0" />
			</div>
			<progress id="progress" value="0" min="0"></progress>
		</div>
	</body>
</html>
